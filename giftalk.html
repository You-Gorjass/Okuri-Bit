<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giftalk — AIギフト相談 | Okuri-Bit</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
  <style>
    body { background: linear-gradient(160deg, #0f0c29 0%, #1e1040 50%, #24243e 100%); min-height: 100vh; }

    /* ===== Header ===== */
    .gt-header {
      background: rgba(15,12,41,0.92);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(16px);
    }
    .gt-header .logo-text { color: white; -webkit-text-fill-color: white; }

    /* ===== Layout ===== */
    .gt-layout {
      max-width: 820px;
      margin: 0 auto;
      padding: 0 16px 120px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* ===== Hero ===== */
    .gt-hero {
      text-align: center;
      padding: 44px 16px 28px;
      color: white;
    }
    .gt-logo-wrap {
      position: relative;
      width: 82px; height: 82px;
      margin: 0 auto 18px;
    }
    .gt-logo-ring {
      position: absolute; inset: -6px;
      border-radius: 50%;
      border: 2px solid rgba(168,85,247,0.35);
      animation: spin-slow 8s linear infinite;
    }
    @keyframes spin-slow { 0%{transform:rotate(0deg);}100%{transform:rotate(360deg);} }
    .gt-logo {
      width: 82px; height: 82px;
      background: linear-gradient(135deg, #A855F7, #7c3aed);
      border-radius: 28px;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem;
      box-shadow: 0 12px 40px rgba(168,85,247,0.55);
    }
    .gt-hero h1 { font-size: 2rem; font-weight: 900; margin-bottom: 8px; }
    .gt-hero h1 span {
      background: linear-gradient(135deg, #FF6B9D, #A855F7, #60a5fa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .gt-hero p { color: rgba(255,255,255,0.65); font-size: 0.92rem; line-height: 1.7; max-width: 480px; margin: 0 auto; }

    /* ===== Progress Steps ===== */
    .gt-steps {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      margin: 24px 0 20px;
      padding: 0 16px;
    }
    .gt-step {
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      flex-shrink: 0;
    }
    .gt-step-num {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 2px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.4);
      font-size: 0.8rem; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.4s;
    }
    .gt-step.done .gt-step-num { background: #4ade80; border-color: #4ade80; color: white; }
    .gt-step.active .gt-step-num { background: linear-gradient(135deg,#FF6B9D,#A855F7); border-color: transparent; color: white; box-shadow: 0 4px 14px rgba(255,107,157,0.4); }
    .gt-step-label { font-size: 0.65rem; color: rgba(255,255,255,0.4); font-weight: 700; white-space: nowrap; transition: color 0.4s; }
    .gt-step.active .gt-step-label { color: rgba(255,255,255,0.85); }
    .gt-step.done .gt-step-label { color: #4ade80; }
    .gt-step-line { width: 32px; height: 2px; background: rgba(255,255,255,0.1); margin-bottom: 20px; flex-shrink: 0; transition: background 0.4s; }
    .gt-step-line.done { background: #4ade80; }

    /* ===== Chat Container ===== */
    .gt-chat-wrap {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 28px;
      overflow: hidden;
      backdrop-filter: blur(20px);
      display: flex; flex-direction: column;
    }
    .gt-chat-header {
      background: rgba(168,85,247,0.18);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 14px 20px;
      display: flex; align-items: center; gap: 12px; color: white;
    }
    .gt-ai-avatar {
      width: 42px; height: 42px;
      background: linear-gradient(135deg,#A855F7,#7c3aed);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; flex-shrink: 0;
    }
    .gt-chat-header .ch-name { font-weight: 800; font-size: 0.93rem; }
    .gt-chat-header .ch-status {
      font-size: 0.73rem; color: #4ade80;
      display: flex; align-items: center; gap: 4px;
    }
    .status-dot { width: 7px; height: 7px; background: #4ade80; border-radius: 50%; animation: blink 1.5s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1;}50%{opacity:0.3;} }
    .ch-phase-badge {
      margin-left: auto;
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.65);
      font-size: 0.72rem; font-weight: 700;
      padding: 4px 12px; border-radius: 50px;
      transition: all 0.3s;
    }

    /* ===== Messages ===== */
    .gt-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex; flex-direction: column;
      gap: 16px;
      min-height: 340px;
      max-height: 480px;
    }
    .gt-messages::-webkit-scrollbar { width: 4px; }
    .gt-messages::-webkit-scrollbar-thumb { background: rgba(168,85,247,0.35); border-radius:4px; }

    .msg { display: flex; gap: 10px; align-items: flex-end; opacity: 0; animation: msg-in 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards; }
    @keyframes msg-in { from{opacity:0;transform:translateY(14px) scale(0.96);}to{opacity:1;transform:translateY(0) scale(1);} }
    .msg.user { flex-direction: row-reverse; }
    .msg-av { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
    .msg.ai .msg-av { background: linear-gradient(135deg,#A855F7,#7c3aed); }
    .msg.user .msg-av { background: linear-gradient(135deg,#FF6B9D,#e0558a); }
    .msg-content { max-width: 78%; display: flex; flex-direction: column; gap: 6px; }
    .msg.user .msg-content { align-items: flex-end; }
    .msg-bubble {
      padding: 12px 16px; border-radius: 18px;
      font-size: 0.88rem; line-height: 1.7;
    }
    .msg.ai .msg-bubble { background: rgba(255,255,255,0.1); color: white; border-bottom-left-radius: 5px; }
    .msg.user .msg-bubble { background: linear-gradient(135deg,#FF6B9D,#A855F7); color: white; border-bottom-right-radius: 5px; }
    .msg-time { font-size: 0.65rem; color: rgba(255,255,255,0.35); padding: 0 4px; }

    /* Quick reply chips */
    .qr-chips {
      display: flex; flex-wrap: wrap; gap: 8px;
      margin-top: 6px;
    }
    .qr-chip {
      background: rgba(168,85,247,0.18);
      border: 1px solid rgba(168,85,247,0.35);
      color: rgba(255,255,255,0.85);
      padding: 7px 14px; border-radius: 50px;
      font-size: 0.8rem; font-weight: 700;
      cursor: pointer; transition: all 0.2s;
    }
    .qr-chip:hover { background: rgba(168,85,247,0.38); border-color: #A855F7; color: white; }

    /* Gift suggestion cards */
    .gift-suggestions { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
    .gs-card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px; padding: 13px 16px;
      display: flex; align-items: center; gap: 14px;
      cursor: pointer; transition: all 0.22s;
    }
    .gs-card:hover { background: rgba(168,85,247,0.22); border-color: rgba(168,85,247,0.5); transform: translateX(4px); }
    .gs-emoji { font-size: 1.9rem; }
    .gs-info .gs-name { font-weight: 800; font-size: 0.87rem; color: white; }
    .gs-info .gs-desc { font-size: 0.73rem; color: rgba(255,255,255,0.6); margin-top: 2px; }
    .gs-right { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .gs-price { color: #FFD700; font-weight: 900; font-size: 0.88rem; white-space: nowrap; }
    .gs-pick-btn {
      background: linear-gradient(135deg,#FF6B9D,#A855F7);
      color: white; border: none;
      padding: 6px 14px; border-radius: 20px;
      font-size: 0.75rem; font-weight: 800;
      cursor: pointer; white-space: nowrap; font-family: inherit;
    }
    /* Set suggestion card */
    .gs-set-card {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(168,85,247,0.25);
      border-radius: 18px; padding: 14px 16px;
      cursor: pointer; transition: all 0.22s; margin-top: 2px;
    }
    .gs-set-card:hover { background: rgba(168,85,247,0.2); transform: translateX(4px); }
    .gs-set-header {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
    }
    .gs-set-label { font-size: 0.78rem; font-weight: 800; color: rgba(255,255,255,0.8); }
    .gs-set-price { color: #FFD700; font-weight: 900; font-size: 0.85rem; }
    .gs-set-items { display: flex; gap: 10px; }
    .gs-set-item { text-align: center; flex: 1; }
    .gs-set-item .gsi-emoji { font-size: 1.5rem; display: block; }
    .gs-set-item .gsi-name { font-size: 0.65rem; color: rgba(255,255,255,0.65); margin-top: 3px; }
    .gs-set-footer {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 10px; padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .gs-set-hint { font-size: 0.72rem; color: rgba(255,255,255,0.5); }

    /* Typing indicator */
    .typing-wrap { display: flex; gap: 10px; align-items: flex-end; opacity: 0; animation: msg-in 0.35s forwards; }
    .typing-bubble {
      background: rgba(255,255,255,0.1);
      padding: 12px 16px; border-radius: 18px; border-bottom-left-radius: 5px;
    }
    .typing-dots { display: flex; gap: 5px; }
    .td { width: 8px; height: 8px; background: rgba(255,255,255,0.45); border-radius: 50%; animation: td-bounce 1.2s ease-in-out infinite; }
    .td:nth-child(2){animation-delay:0.2s;} .td:nth-child(3){animation-delay:0.4s;}
    @keyframes td-bounce { 0%,100%{transform:translateY(0);opacity:0.45;} 50%{transform:translateY(-6px);opacity:1;} }

    /* ===== Input area ===== */
    .gt-input-area {
      background: rgba(0,0,0,0.25);
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 14px 16px 16px;
    }
    .gt-quick-bar {
      display: flex; gap: 7px; overflow-x: auto; padding-bottom: 8px;
      scrollbar-width: none;
    }
    .gt-quick-bar::-webkit-scrollbar { display: none; }
    .gq-chip {
      flex-shrink: 0;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.13);
      color: rgba(255,255,255,0.75);
      padding: 5px 13px; border-radius: 50px;
      font-size: 0.77rem; font-weight: 700;
      cursor: pointer; transition: all 0.2s; font-family: inherit;
    }
    .gq-chip:hover { background: rgba(168,85,247,0.22); border-color: #A855F7; color: white; }
    .gt-input-row { display: flex; gap: 10px; align-items: flex-end; margin-top: 10px; }
    .gt-input {
      flex: 1; background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 22px; padding: 11px 17px;
      color: white; font-size: 0.9rem; font-family: inherit;
      outline: none; resize: none; min-height: 44px; max-height: 110px;
      transition: border-color 0.2s;
    }
    .gt-input::placeholder { color: rgba(255,255,255,0.35); }
    .gt-input:focus { border-color: rgba(168,85,247,0.55); }
    .gt-send-btn {
      width: 44px; height: 44px;
      background: linear-gradient(135deg,#A855F7,#7c3aed);
      border: none; border-radius: 50%; color: white;
      font-size: 0.95rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(168,85,247,0.4);
    }
    .gt-send-btn:hover { transform: scale(1.1); }
    .gt-send-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    /* Phase context bar */
    .phase-bar {
      background: rgba(168,85,247,0.12);
      border: 1px solid rgba(168,85,247,0.2);
      border-radius: 16px;
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    }
    .phase-tag {
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.8);
      padding: 4px 12px; border-radius: 50px;
      font-size: 0.75rem; font-weight: 700;
    }
    .phase-tag.filled { background: linear-gradient(135deg,#FF6B9D,#A855F7); color: white; }

    @media (max-width:640px) {
      .gt-hero h1 { font-size: 1.6rem; }
      .gt-messages { max-height: 360px; }
    }
  </style>
</head>
<body>

<header class="site-header gt-header">
  <div class="header-inner">
    <a href="index.html" class="logo">
      <div class="logo-icon">🎁</div>

  <!-- Context bar (shows filled info) -->

    <div class="gt-messages" id="gtMessages"></div>

    <div class="gt-input-area">
      <div class="gt-quick-bar" id="quickBar">
        <!-- JS rendered -->
      </div>
      <div class="gt-input-row">
        <textarea class="gt-input" id="gtInput" placeholder="メッセージを入力…" rows="1"
          onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="gt-send-btn" id="sendBtn" onclick="handleSend()">
          <i class="fas fa-paper-plane"></i>
        </button>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

const EMOTION_MAP = {
  '応援':    'cheer', 'がんばれ':'cheer', '頑張':'cheer', '応援したい':'cheer',
  '感謝':    'thanks','お礼':'thanks','ありがとう':'thanks','お世話':'thanks',

  '好き':    'love',  '恋':'love','愛':'love','カップル':'love','デート':'love','記念日':'love',
  '下心':    'hidden','ドキドキ':'hidden','意識':'hidden',
  '裏心':    'secret','こっそり':'secret',
  '義理':    'duty',  '義務':'duty','仕方なく':'duty','せっかく':'duty',
  '自己満':  'self',  '自分的に':'self','自分が好き':'self',
};
const TARGET_MAP = {
  '友達':'友人','友人':'友人','親友':'友人',
  '上司':'上司','先輩':'上司','部長':'上司','社長':'上司',
  '恋人':'恋人','彼女':'恋人','彼氏':'恋人','パートナー':'恋人',

  '同僚':'同僚','後輩':'同僚','部下':'同僚',
};
const OCCASION_MAP = {
  '誕生日':'誕生日','バースデー':'誕生日',
  '退職':'退職祝い',
  '就職':'就職・転職祝い','転職':'就職・転職祝い',

  '合格':'合格祝い','受験':'合格祝い',
};

function detectEmotion(t) { for(const[k,v] of Object.entries(EMOTION_MAP)){if(t.includes(k))return v;} return null; }
function detectTarget(t)  { for(const[k,v] of Object.entries(TARGET_MAP)){if(t.includes(k))return v;} return null; }
function detectOccasion(t){ for(const[k,v] of Object.entries(OCCASION_MAP)){if(t.includes(k))return v;} return null; }
function detectBudget(t)  { const m=t.match(/(\d[\d,，]*)/g); if(!m)return null; const ns=m.map(n=>parseInt(n.replace(/[,，]/g,''))).filter(n=>n>=500&&n<=500000); return ns.length?Math.max(...ns):null; }

// SUGGESTION ENGINE
// ============================================================
function buildSuggestions() {
  const em = conv.emotion;
  const bud = conv.budget;
  const prefs = conv.preferences;

  // Singles
  let singles = em ? GIFTS.filter(g => g.emotions.includes(em)) : GIFTS;
  if (bud) singles = singles.filter(g => g.price <= bud);
  // preference-based boost
  if (prefs.includes('relax')) singles = singles.filter(g => ['g8','g17','g20','g19'].includes(g.id)).concat(singles);
  if (prefs.includes('food'))  singles = singles.filter(g => ['g2','g15','g18','g23'].includes(g.id)).concat(singles);
  if (prefs.includes('fun'))   singles = singles.filter(g => ['g14','g21','g3'].includes(g.id)).concat(singles);
  // dedupe
  const seenS = new Set();
  const topSingles = singles.filter(g => { if(seenS.has(g.id))return false;seenS.add(g.id);return true; }).slice(0,3);

  // Sets
  let sets = em ? ALL_SETS.filter(s => s.emotions.includes(em)) : ALL_SETS;
  if (bud) sets = sets.filter(s => s.price <= bud);
  const topSets = sets.slice(0,2);

  conv.finalSuggestions = { singles: topSingles, sets: topSets };
}

// ============================================================
// PROCESS USER MESSAGE
// ============================================================
function processMessage(userText) {
  const t = userText;
  const lower = t.toLowerCase();

  // Always try to extract info
  const detEmo = detectEmotion(t);
  const detTar = detectTarget(t);
  const detOcc = detectOccasion(t);
  const detBud = detectBudget(t);
  if(detEmo && !conv.emotion) conv.emotion = detEmo;
  if(detTar && !conv.target)  conv.target = detTar;
  if(detOcc && !conv.occasion)conv.occasion = detOcc;
  if(detBud && !conv.budget)  conv.budget = detBud;

  // Phase-specific extra extractions
  if(conv.phase===4){
    if(t.includes('リラックス')||t.includes('癒し')) conv.preferences.push('relax');
    if(t.includes('食べ')||t.includes('グルメ')||t.includes('飲み')||t.includes('スイーツ')) conv.preferences.push('food');
    if(t.includes('エンタメ')||t.includes('ゲーム')||t.includes('映画')||t.includes('趣味')) conv.preferences.push('fun');
    if(t.includes('かわい')||t.includes('可愛')||t.includes('キュート')) conv.preferences.push('cute');
    if(t.includes('実用')||t.includes('使える')||t.includes('便利')) conv.preferences.push('practical');
  }

  updateContextBar();

  // Determine next response
  let response = null;

  if(conv.phase === 0 || conv.phase === 1) {
    // Need emotion
    if(!conv.emotion) {
      response = {
        text: '気持ちをもう少し教えてもらえますか？😊\n（例：応援したい、感謝を伝えたい、癒してあげたい…）',
        quickReplies: ['💪 応援したい','🙏 感謝を伝えたい','🫶 疲れを労いたい','💕 好きな人に'],
      };
      conv.phase = 1;
    } else {
      conv.phase = 2;
      response = PHASE_SCRIPTS.afterEmotion();
    }
  } else if(conv.phase === 2) {
    // Need target
    if(!conv.target) {
      response = {
        text: 'なるほど！贈る相手を教えてもらえますか？',
        quickReplies: ['👫 友人','💑 恋人','👔 上司','👪 家族','🤝 同僚'],
      };
    } else {
      conv.phase = 3;
      response = PHASE_SCRIPTS.afterTarget();
    }
  } else if(conv.phase === 3) {
    // Need budget
    if(!conv.budget && !t.includes('気にしない')&&!t.includes('なんでも')&&!t.includes('いくらでも')) {
      response = {
        text: 'ざっくりで大丈夫です！だいたいの予算を教えてください💰',
        quickReplies: ['〜¥1,500','〜¥3,000','〜¥5,000','〜¥10,000','予算は気にしない'],
      };
    } else {
      if(t.includes('気にしない')||t.includes('なんでも')||t.includes('いくらでも')) conv.budget = null;
      conv.phase = 4;
      conv.refineCount = 0;
      response = PHASE_SCRIPTS.afterBudget();
    }
  } else if(conv.phase === 4) {
    // Refine phase
    if(t.includes('そのまま')||t.includes('提案')||t.includes('いい')||conv.refineCount>=1){
      // Go to propose
      conv.phase = 5;
      buildSuggestions();
      response = buildProposalResponse();
    } else {
      conv.refineCount++;
      const script = PHASE_SCRIPTS.afterRefine();
      if(script){
        response = script;
      } else {
        conv.phase = 5;
        buildSuggestions();
        response = buildProposalResponse();
      }
    }
  } else if(conv.phase === 5) {
    // After proposal — handle follow-up
    response = handlePostProposal(t);
  }

  return response || { text: '少し教えてもらえますか？もう一度状況を話してもらえると、より良い提案ができます😊' };
}

function buildProposalResponse() {
  const sug = conv.finalSuggestions;
  const target = conv.target || 'ご相手';
  const emLabels = { cheer:'応援',thanks:'感謝',care:'労い',love:'愛情',hidden:'ドキドキ系',duty:'義理感なし',self:'自己満足',other:'おすすめ' };
  const emLabel = emLabels[conv.emotion] || 'ぴったり';

  let text = `✨ **${target}への${emLabel}ギフト** をまとめました！\n\n`;
  if(sug.singles.length>0) text += `📌 **単品ギフト**（${sug.singles.length}点）と`;
  if(sug.sets.length>0) text += `🎀 **3択セット**（${sug.sets.length}点）を提案します。\n\n`;
  text += '気に入ったものをタップして贈ってみてください💌\n\nもっと絞り込みたい場合は「他のを見せて」「もっと安いもの」などと話しかけてください！';

  return { text, gifts: sug, quickReplies:['他のも見せて','もっと安いもの','もっと高くてもいい','セットをもっと見たい'] };
}

function handlePostProposal(t) {
  if(t.includes('安い')||t.includes('もっと低い')){
    if(conv.budget) conv.budget = Math.floor(conv.budget * 0.7);
    else conv.budget = 3000;
    buildSuggestions();
    return { text:`予算を少し下げて再提案します😊`, gifts: conv.finalSuggestions };
  }
  if(t.includes('高い')||t.includes('もっと高')){
    if(conv.budget) conv.budget = Math.floor(conv.budget * 1.5);
    else conv.budget = 8000;
    buildSuggestions();
    return { text:`もう少しプレミアムなものも見てみましょう！`, gifts: conv.finalSuggestions };
  }
  if(t.includes('他の')||t.includes('違う')||t.includes('もっと見')){
    const em = conv.emotion;
    let pool = em ? GIFTS.filter(g=>g.emotions.includes(em)) : GIFTS;
    if(conv.budget) pool = pool.filter(g=>g.price<=conv.budget);
    const already = new Set(conv.finalSuggestions.singles.map(g=>g.id));
    const others = pool.filter(g=>!already.has(g.id)).slice(0,3);
    const otherSets = ALL_SETS.filter(s=>!conv.finalSuggestions.sets.find(x=>x.id===s.id)).slice(0,2);
    if(others.length===0) return { text:'これ以上の候補が見つかりませんでした🙏 ギフト選択ページからも探せますよ！', quickReplies:['🎁 ギフトページへ'] };
    conv.finalSuggestions = { singles: others, sets: otherSets };
    return { text:'他のおすすめも持ってきました！', gifts: conv.finalSuggestions };
  }
  if(t.includes('ギフトページ')||t.includes('ページへ')){
    setTimeout(()=>{ window.location.href='gift.html'; },1200);
    return { text:'ギフト選択ページへ移動します😊✨' };
  }
  return {
    text: 'ご質問があればどうぞ😊\n「他のも見せて」「もっと安いもの」「もっと高くてもいい」などと話しかけてください！',
    quickReplies:['他のも見せて','もっと安いもの','もっと高くてもいい','ギフトページへ'],
  };
}

// ============================================================
// SEND
// ============================================================
function handleSend() {
  if(isTyping) return;
  const inp = document.getElementById('gtInput');
  const txt = inp.value.trim();
  if(!txt) return;
  inp.value=''; inp.style.height='44px';
  sendMessage(txt, txt);
}

function sendQuick(display, value) {
  sendMessage(display, value);
}

function sendMessage(displayText, valueText) {
  if(isTyping) return;
  addMsg('user', displayText);
  isTyping = true;
  document.getElementById('sendBtn').disabled = true;

  showTyping();
  const delay = 700 + Math.random() * 900;
  setTimeout(() => {
    removeTyping();
    const res = processMessage(valueText);
    addMsg('ai', res.text, res.gifts || null, res.quickReplies || null);
    updateSteps();
    updateQuickBar(conv.phase);
    isTyping = false;
    document.getElementById('sendBtn').disabled = false;
  }, delay);
}

function pickGiftFromChat(giftId) {
  const g = GIFTS.find(x=>x.id===giftId);
  if(!g) return;
  sessionStorage.setItem('selectedGift', JSON.stringify(g));
  showToast(`${g.emoji} ${g.name} を選択！アバター作成へ移動します…`);
  setTimeout(()=>{ window.location.href='avatar.html'; }, 1400);
}

function pickSetFromChat(setId) {
  const s = ALL_SETS.find(x=>x.id===setId);
  if(!s) return;
  sessionStorage.setItem('selectedGift', JSON.stringify({
    id:'set', name: s.label,
    emoji: s.emoji,
    price: s.price, isSet:true,
    setItems: s.items,
  }));
  showToast(`🎀 「${s.label}」を選択！アバター作成へ移動します…`);
  setTimeout(()=>{ window.location.href='avatar.html'; }, 1400);
}

function insertText(t) {
  const inp = document.getElementById('gtInput');
  inp.value += t;
  inp.focus();
}

function handleKey(e) {
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); handleSend(); }
}

function autoResize(el) {
  el.style.height='44px';
  el.style.height = Math.min(el.scrollHeight,110)+'px';
}

function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

// ============================================================
// INIT
// ============================================================
function init() {
  updateSteps();
  updateQuickBar(0);
  // Greeting
  setTimeout(()=>{
    const s = PHASE_SCRIPTS.greeting();
    addMsg('ai', s.text, null, s.quickReplies);
    conv.phase = 1;
    updateSteps();
    updateQuickBar(1);
  }, 400);
}

init();
</script>
